name: cf-purge-on-deploy

# Targeted edge invalidation: every merge/push to main purges ONLY what that
# merge affected — never purge_everything.
#
# Two signals from the merge diff (see compute job):
# - files: public/* -> exact asset URLs; route files -> their page URLs
#   (dynamic [slug] collapses to section index); blog post MDX ->
#   post URLs PLUS index surfaces (/blog, /, /sitemap.xml, /rss.xml —
#   eager, see scripts/cf-map-diff.py); content/data + shared code ->
#   small aggregate set (/ /blog /sitemap.xml /rss.xml /llms.txt /llms-full.txt
#   /opengraph-image). Cap 1000 URLs. NOTE: no wildcards — Cloudflare
#   single-file purges reject them, so `/api/feeds/*` freshness is covered
#   by the `pnet-feeds` TAG purge below, not by files.
# - tags: shared-code changes -> `pnet-html` (all HTML) + `pnet-feeds` (all
#   force-static feeds incl. /api/feeds/* + /api/products/*, which carry only
#   the feeds tag — without this they stay stale up to 1yr after code merges).
#   Tags are emitted by next.config.mjs (`Cache-Tag` header; Cloudflare strips
#   it on delivery).
# API/admin paths are skipped (not edge-cached page content), except the
# edge-cached feed APIs above which map via their route files + tags.
# Manual runs accept extra_paths (space/comma list); manual TAG purges go
# through the controller with invalidation_type: tags.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extra_paths:
        description: "Extra space/comma-separated paths to purge (e.g. '/pricing /sitemap.xml')"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  wait-for-vercel-cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deploy to go live
        # Purging before the new deployment serves traffic would just
        # re-cache the OLD build.
        run: sleep 180

  compute-changed-urls:
    name: Derive affected URLs + tags from merge diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files_json: ${{ steps.map.outputs.files_json }}
      count: ${{ steps.map.outputs.count }}
      tags_csv: ${{ steps.map.outputs.tags_csv }}
    steps:
      - name: Checkout caller (for merge diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Map changed files to edge URLs + cache tags
        id: map
        env:
          APP_PREFIX: ""
          ROUTE_ROOT: "app"
          HOSTS: "www.pantaleone.net pantaleone.net"
          AGG_PATHS: "/ /blog /sitemap.xml /rss.xml /llms.txt"
          PFX: "pnet"
          DATA_TAG: ""
          BEFORE: ${{ github.event.before }}
          EXTRA: ${{ inputs.extra_paths }}
        run: |
          set -euo pipefail
          BEFORE="${BEFORE:-}"
          SHA="${{ github.sha }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            DIFF="$(git diff --name-only "$BEFORE" "$SHA" || true)"
          else
            DIFF="$(git show --name-only --pretty=format: "$SHA" || true)"
          fi
          APP_PREFIX="$APP_PREFIX" ROUTE_ROOT="$ROUTE_ROOT" HOSTS="$HOSTS" AGG_PATHS="$AGG_PATHS" PFX="$PFX" DATA_TAG="$DATA_TAG" DIFF="$DIFF" EXTRA="$EXTRA" python3 scripts/cf-map-diff.py
  purge-cdn:
    needs: [compute-changed-urls, wait-for-vercel-cutover]
    if: needs.compute-changed-urls.outputs.files_json != '' && needs.compute-changed-urls.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge Cloudflare cache (files)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          PAYLOAD_VALUE: ${{ needs.compute-changed-urls.outputs.files_json }}
          INV_TYPE: "files"
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_TOKEN"
          if [[ "$INV_TYPE" == "tags" ]]; then
            PAYLOAD=$(printf '%s' "$PAYLOAD_VALUE" | tr ',' '\n' | jq -R -s -c '
              split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0))
              | {tags: .}
            ')
          else
            # Cloudflare caps single-file purges per call by plan (error 1094)
            # — batch into chunks of 30 so large content edits still clear fully.
            CHUNKS=$(printf '%s' "$PAYLOAD_VALUE" | jq -c '[_nwise(30)] | length')
            echo "Purging $INV_TYPE in $CHUNKS batche(s) of <=30"
            FAIL=0
            for ((n = 0; n < CHUNKS; n++)); do
              PAYLOAD=$(printf '%s' "$PAYLOAD_VALUE" | jq -c --argjson n "$n" '{files: ([_nwise(30)][$n])}')
              echo "Purging $INV_TYPE batch $((n + 1))/$CHUNKS"
              RESP=$(curl -sS --max-time 30 --retry 2 --retry-delay 3 -X POST             -H "Authorization: Bearer ${CF_TOKEN}"             -H "Content-Type: application/json"             --data "$PAYLOAD"             "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache")
              echo "$RESP"
              echo "$RESP" | jq -e '.success == true' > /dev/null || { echo "::error::purge failed (batch $((n + 1)))"; FAIL=1; }
            done
            [ "$FAIL" = "0" ] || exit 1
          fi
          echo "purge succeeded ($INV_TYPE)"
  purge-tags:
    needs: [compute-changed-urls, wait-for-vercel-cutover]
    if: needs.compute-changed-urls.outputs.tags_csv != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge Cloudflare cache (tags)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          PAYLOAD_VALUE: ${{ needs.compute-changed-urls.outputs.tags_csv }}
          INV_TYPE: "tags"
        run: |
          set -euo pipefail
          echo "::add-mask::$CF_TOKEN"
          if [[ "$INV_TYPE" == "tags" ]]; then
            PAYLOAD=$(printf '%s' "$PAYLOAD_VALUE" | tr ',' '\n' | jq -R -s -c '
              split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0))
              | {tags: .}
            ')
          else
            # Cloudflare caps single-file purges per call by plan (error 1094)
            # — batch into chunks of 30 so large content edits still clear fully.
            CHUNKS=$(printf '%s' "$PAYLOAD_VALUE" | jq -c '[_nwise(30)] | length')
            echo "Purging $INV_TYPE in $CHUNKS batche(s) of <=30"
            FAIL=0
            for ((n = 0; n < CHUNKS; n++)); do
              PAYLOAD=$(printf '%s' "$PAYLOAD_VALUE" | jq -c --argjson n "$n" '{files: ([_nwise(30)][$n])}')
              echo "Purging $INV_TYPE batch $((n + 1))/$CHUNKS"
              RESP=$(curl -sS --max-time 30 --retry 2 --retry-delay 3 -X POST             -H "Authorization: Bearer ${CF_TOKEN}"             -H "Content-Type: application/json"             --data "$PAYLOAD"             "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache")
              echo "$RESP"
              echo "$RESP" | jq -e '.success == true' > /dev/null || { echo "::error::purge failed (batch $((n + 1)))"; FAIL=1; }
            done
            [ "$FAIL" = "0" ] || exit 1
          fi
          echo "purge succeeded ($INV_TYPE)"

  warm-edge:
    needs: [compute-changed-urls, wait-for-vercel-cutover]
    if: needs.compute-changed-urls.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-warm freshly purged URLs (one controlled fetch each)
        # Without this, the first wave of visitors/crawlers after a purge
        # stampedes the origin at once (ISR reads + transfer spike). Warming
        # here pays one origin fetch per URL, then the edge serves everyone.
        env:
          FILES_JSON: ${{ needs.compute-changed-urls.outputs.files_json }}
        run: |
          set -euo pipefail
          # Slice in jq (not `head`) so the writer never hits a closed pipe
          # under pipefail; warming is best-effort (bot protection may 403
          # runner IPs), so never fail the run here.
          echo "$FILES_JSON" | jq -r '.[0:25][]' | while IFS= read -r url; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            echo "$code $url"
          done || echo "warm-edge: best-effort only, continuing"
