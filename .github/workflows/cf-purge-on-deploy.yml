name: cf-purge-on-deploy

# Targeted edge invalidation: every merge/push to main purges ONLY what that
# merge affected — never purge_everything.
#
# Two signals from the merge diff (see compute job):
# - files: public/* -> exact asset URLs; route files -> their page URLs
#   (dynamic [slug] collapses to section index); content/data + shared code ->
#   small aggregate set (/ /sitemap.xml /rss.xml). Cap 1000 URLs.
# - tags: shared-code changes -> `pnet-html` (all HTML, assets stay warm);
#   catalog-data changes -> `(none configured)`. Tags are emitted by proxy.ts
#   (`Cache-Tag` header; Cloudflare strips it on delivery).
# API/admin paths are skipped (not edge-cached page content).
# Manual runs accept extra_paths (space/comma list); manual TAG purges go
# through the controller with invalidation_type: tags.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extra_paths:
        description: "Extra space/comma-separated paths to purge (e.g. '/pricing /sitemap.xml')"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  wait-for-vercel-cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deploy to go live
        # Purging before the new deployment serves traffic would just
        # re-cache the OLD build.
        run: sleep 180

  compute-changed-urls:
    name: Derive affected URLs + tags from merge diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files_json: ${{ steps.map.outputs.files_json }}
      count: ${{ steps.map.outputs.count }}
      tags_csv: ${{ steps.map.outputs.tags_csv }}
    steps:
      - name: Checkout (for merge diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Map changed files to edge URLs + cache tags
        id: map
        env:
          APP_PREFIX: ""
          ROUTE_ROOT: "app"
          HOSTS: "www.pantaleone.net pantaleone.net"
          AGG_PATHS: "/ /sitemap.xml /rss.xml"
          PFX: "pnet"
          DATA_TAG: ""
          BEFORE: ${{ github.event.before }}
          EXTRA: ${{ inputs.extra_paths }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          BEFORE="${BEFORE:-}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            DIFF="$(git diff --name-only "$BEFORE" "$SHA" || true)"
          else
            DIFF="$(git show --name-only --pretty=format: "$SHA" || true)"
          fi
          BEFORE="$BEFORE" SHA="$SHA" DIFF="$DIFF" python3 - <<'PY'
          import json, os
          prefix, rroot = os.environ["APP_PREFIX"], os.environ["ROUTE_ROOT"]
          hosts, aggs = os.environ["HOSTS"].split(), os.environ["AGG_PATHS"].split()
          pfx, data_tag = os.environ["PFX"], os.environ["DATA_TAG"].strip()
          files = [l for l in os.environ["DIFF"].splitlines() if l.strip()]
          extra = [p.strip() for p in os.environ.get("EXTRA", "").replace(",", " ").split() if p.strip()]
          urls, code_hit, data_hit = set(), False, False
          def add(path):
              if not path.startswith("/"): path = "/" + path
              for h in hosts:
                  urls.add(f"https://{h}{path}")
                  if path != "/": urls.add(f"https://{h}{path.rstrip('/')}/")
          def add_aggs():
              for a in aggs: add(a)
          CONTENT_TOPS = {"data", "content", "contents", "posts", "blog", "articles", "mdx", "recipes_mdx"}
          for f in files:
              g = f[len(prefix):] if prefix and f.startswith(prefix) else (f if not prefix else None)
              if g is None:
                  code_hit = True; add_aggs(); continue
              if g.startswith("public/"):
                  add(g[len("public/"):]); continue
              if g.startswith(rroot + "/"):
                  rel = g[len(rroot) + 1:]
                  parts = [p for p in rel.split("/") if not (p.startswith("(") and p.endswith(")"))]
                  if not parts:
                      code_hit = True; add_aggs(); continue
                  leaf, d = parts[-1], "/".join(parts[:-1])
                  base = leaf.rsplit(".", 1)[0] if "." in leaf else leaf
                  if base in ("page", "route", "layout", "loading", "error", "not-found", "template", "default"):
                      url = "/" + d if d else "/"
                  elif base == "sitemap": url = "/sitemap.xml"
                  elif base == "robots": url = "/robots.txt"
                  elif base == "manifest": url = "/manifest.webmanifest"
                  elif leaf in ("favicon.ico", "icon.png", "icon1.png", "icon2.png", "apple-touch-icon.png"): url = ("/" + d + "/" + leaf) if d else ("/" + leaf)
                  elif base in ("feed", "rss") or leaf in ("feed.xml", "rss.xml", "feed.json"): url = ("/" + d + "/" + leaf) if d else ("/" + leaf)
                  elif leaf in ("llms.txt", "llms-full.txt", "agents.txt", "agents.md", "agents.json", "openapi.json"): url = ("/" + d + "/" + leaf) if d else ("/" + leaf)
                  elif base in ("opengraph-image", "twitter-image"): url = ("/" + d + "/" + base) if d else ("/" + base)
                  else: url = "/" + d if d else "/"
                  if "[" in url: url = url.split("[")[0].rstrip("/") or "/"
                  add(url); continue
              top = g.split("/")[0]
              if top in CONTENT_TOPS:
                  data_hit = True; add_aggs(); continue
              if g.startswith("api/") or "/api/" in g or top in ("admin",):
                  continue
              code_hit = True; add_aggs()
          for p in extra: add(p)
          tags = []
          if code_hit: tags.append(f"{pfx}-html")
          if data_hit and data_tag: tags.append(data_tag)
          out = sorted(urls)[:1000]
          print(f"Mapped {len(files)} changed file(s) -> {len(out)} URL(s), tags={tags or 'none'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("files_json=" + json.dumps(out, separators=(",", ":")) + "\n")
              fh.write(f"count={len(out)}\n")
              fh.write("tags_csv=" + ",".join(tags) + "\n")
          PY
  purge-cdn:
    needs: [compute-changed-urls, wait-for-vercel-cutover]
    if: needs.compute-changed-urls.outputs.count != '0'
    uses: pantaleone-ai/cloudflare-cache-controller/.github/workflows/cloudflare-invalidate.yml@v1
    with:
      zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      invalidation_type: files
      invalidation_value: ${{ needs.compute-changed-urls.outputs.files_json }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  purge-tags:
    needs: [compute-changed-urls, wait-for-vercel-cutover]
    if: needs.compute-changed-urls.outputs.tags_csv != ''
    uses: pantaleone-ai/cloudflare-cache-controller/.github/workflows/cloudflare-invalidate.yml@v1
    with:
      zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      invalidation_type: tags
      invalidation_value: ${{ needs.compute-changed-urls.outputs.tags_csv }}
    secrets:
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
