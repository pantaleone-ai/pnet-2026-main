name: social-collect

# Daily performance collection (read-only APIs) -> BigQuery hub.
# Collectors write JSONL, bq load replaces staging tables, MERGE dedupes
# into canonical tables. Observations are append-only by design;
# social_posts dedupes on post_id. Never fabricates: collector nulls stay null.
# Runs ~07:15 ET daily. Manual dispatch defaults to dry-run (plan only).
# Cron is UTC: 11:15 UTC = 07:15 EDT. Revisit on EST (UTC-5) change.
# Requires: META_CAPI_ACCESS_TOKEN + PINTEREST_ACCESS_TOKEN Actions secrets
# (present), WIF trust for github-bq-loader (configured 2026-11-05).

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print the plan without collecting/loading (true/false)"
        required: false
        default: "true"
      limit-posts:
        description: "Max FB/IG posts per account"
        required: false
        default: "50"
      max-pins:
        description: "Max Pinterest pins enumerated"
        required: false
        default: "250"

permissions:
  contents: read
  id-token: write

env:
  BQ_PROJECT: pantaleone-cross-app
  BQ_LOCATION: us-central1
  BQ_DATASET: social_reporting

jobs:
  collect-load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: social-collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Collect — Meta + Pinterest to JSONL
        env:
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          STAMP=$(date -u +%F)
          LIMIT="${{ github.event.inputs.limit-posts || '50' }}"
          MAXPINS="${{ github.event.inputs.max-pins || '250' }}"
          if [ "${{ github.event.inputs.dry-run || 'false' }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx tsx scripts/social-issues/collect/meta-collect.ts --dry-run
            npx tsx scripts/social-issues/collect/pinterest-collect.ts --dry-run
          else
            mkdir -p data/social-metrics
            npx tsx scripts/social-issues/collect/meta-collect.ts --limit-posts "$LIMIT" --out-prefix "data/social-metrics/${STAMP}-meta"
            npx tsx scripts/social-issues/collect/pinterest-collect.ts --max-pins "$MAXPINS" --out-prefix "data/social-metrics/${STAMP}-pin"
            echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          fi
      - name: Auth to Google Cloud (WIF, keyless)
        if: github.event_name == 'schedule' || github.event.inputs.dry-run != 'true'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1013667288588/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-bq-loader@pantaleone-cross-app.iam.gserviceaccount.com"
      - uses: google-github-actions/setup-gcloud@v2
        if: github.event_name == 'schedule' || github.event.inputs.dry-run != 'true'
      - name: Load — staging replace + validated merge
        if: github.event_name == 'schedule' || github.event.inputs.dry-run != 'true'
        run: |
          D="$BQ_PROJECT.$BQ_DATASET"
          bq --location="$BQ_LOCATION" load --replace --source_format=NEWLINE_DELIMITED_JSON \
            "$D.stg_posts" "data/social-metrics/${STAMP}-meta.posts.jsonl" \
            "data/social-metrics/${STAMP}-pin.posts.jsonl"
          bq --location="$BQ_LOCATION" load --replace --source_format=NEWLINE_DELIMITED_JSON \
            "$D.stg_observations" "data/social-metrics/${STAMP}-meta.observations.jsonl" \
            "data/social-metrics/${STAMP}-pin.observations.jsonl"
          bq --location="$BQ_LOCATION" query --nouse_legacy_sql "
            MERGE \`$D.social_posts\` T USING \`$D.stg_posts\` S
            ON T.post_id = S.post_id
            WHEN NOT MATCHED THEN INSERT ROW;"
          bq --location="$BQ_LOCATION" query --nouse_legacy_sql "
            MERGE \`$D.social_metric_observations\` T USING \`$D.stg_observations\` S
            ON T.entity_id = S.entity_id
              AND T.metric_name = S.metric_name
              AND T.metric_scope = S.metric_scope
              AND DATE(T.snapshot_at) = DATE(S.snapshot_at)
              AND IFNULL(T.period_start, TIMESTAMP '1970-01-01 00:00:00+00') = IFNULL(S.period_start, TIMESTAMP '1970-01-01 00:00:00+00')
            WHEN NOT MATCHED THEN INSERT ROW;"
          bq --location="$BQ_LOCATION" query --nouse_legacy_sql --parameter="run_id:STRING:${{ github.run_id }}-${STAMP}" "
            INSERT \`$D.ingest_runs\` (run_id, started_at, source, rows_loaded, status, notes)
            VALUES (@run_id, CURRENT_TIMESTAMP(), 'ci-social-collect',
              (SELECT COUNT(*) FROM \`$D.stg_observations\`), 'ok', 'nightly collect+merge');"
