name: social-ig-slots

# IG slot publisher (IG has no native scheduling API, so slots are published
# just-in-time). Fires at the three daily IG windows and publishes due
# synthetic.pics issues oldest-slot-first (max 2 per run: the current slot
# plus at most one catch-up). Idempotent: proof-present issues never re-fire.
# Cron is UTC (= ET+4 in EDT): 13:05/16:05/22:35 UTC = 9:05am/12:05pm/6:35pm ET.
# Revisit on EST (UTC-5) change.

on:
  schedule:
    - cron: "5 13 * * *"
    - cron: "5 16 * * *"
    - cron: "35 22 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print due slots without publishing (true/false)"
        required: false
        default: "true"

permissions:
  issues: write
  contents: read

jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Anti-slop engine build (copy audit layer)
        run: npm run anti-slop:build
      - name: Publish due IG slots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry-run || 'false' }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx tsx scripts/social-issues/publish/publish-due.ts --due --channel instagram --limit 2 --dry-run
          else
            npx tsx scripts/social-issues/publish/publish-due.ts --due --channel instagram --limit 2
          fi
