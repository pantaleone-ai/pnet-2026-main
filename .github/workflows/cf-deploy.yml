name: cf-deploy

# Vercel-like CI/CD for Cloudflare Workers (OpenNext).
# - push to main  -> build + deploy to production worker
# - pull_request  -> build + upload unpromoted version (preview, no traffic)
# - manual runs   -> workflow_dispatch (defaults to preview upload)
#
# Required repo secret: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on the account).
# Optional secret: CLOUDFLARE_ACCOUNT_ID (inferred from the token when unset).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      promote:
        description: "Deploy to production (otherwise preview upload only)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Build-time public config. NEXT_PUBLIC_* is inlined by Next.js at
      # build time, so CI must provide it here — Worker secrets alone only
      # cover runtime and never reach the client bundle (that gap silently
      # disabled GA/Meta/PostHog in prod). Missing/empty keeps the feature
      # disabled, same as unset (see config/analytics.ts).
      NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_META_PIXEL_ID_SYNTHETIC_PICS: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID_SYNTHETIC_PICS }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_UI_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_UI_HOST }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      - name: Build + deploy to production
        if: github.event_name == 'push' || inputs.promote == 'true'
        env:
          # Prod-host gate (lib/meta-pixel.ts): non-production builds fail
          # closed unless the hostname itself is allowlisted.
          NEXT_PUBLIC_VERCEL_ENV: production
        run: npm run deploy

      - name: Build + upload version preview (no traffic)
        if: github.event_name != 'push' && inputs.promote != 'true'
        run: npm run upload
