name: social-nightly

# Nightly auto-posting pipeline (runs ~02:05 ET): synthetic.pics + mixphd.
# synthetic: gallery poll -> issues -> packets+visuals+merge (no re-approval) ->
# slot stamping (SYN_TIMING_WINDOWS) -> FB native scheduling ->
# Graph-verified audit-close of due proofs.
# mixphd (canary, 2 recipes/night): sitemap poll -> FB+IG issues -> same packet ->
# MIX_TIMING_WINDOWS slots -> FB native schedule + IG slot crons (both live).
# Respin: old catalog art / recipes reposted with a fresh spin (new angle +
# top-crop card, 30d+ rest, exposure-capped) to fill weekend/off-hours slots.
# IG posts go out via social-ig-slots.yml (IG has no scheduling API).
# Kill switches: social.nightly.enabled=false (both) or social.nightly.mixphd.enabled=false (mixphd only).
# Cron is UTC: 06:05 UTC = 02:05 EDT. Revisit on EST (UTC-5) change.

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new artworks to intake (FIFO oldest-first)"
        required: false
        default: "3"
      dry-run:
        description: "Print the plan without creating anything (true/false)"
        required: false
        default: "true"

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Image toolchain (PIL + AVIF decode for card rendering)
        run: pip install --quiet pillow pillow-avif-plugin
      - name: Anti-slop engine build (copy audit layer)
        run: npm run anti-slop:build
      - name: Ensure labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/content-issues/labels.ts
      - name: Intake — synthetic gallery + mixphd recipes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '3' }}"
          if [ "${{ github.event.inputs.dry-run || 'false' }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx tsx scripts/social-issues/gallery-sync.ts --dry-run --limit "$LIMIT"
            npx tsx scripts/social-issues/recipe-sync.ts --dry-run --limit 2
          else
            npx tsx scripts/social-issues/gallery-sync.ts --apply --limit "$LIMIT"
            npx tsx scripts/social-issues/recipe-sync.ts --apply --limit 2 || echo "mixphd intake skipped (kill switch or no fresh recipes)"
          fi
      - name: Commit catalog updates (gallery-sync appends new artwork IDs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- config/social-growth/syn-catalog.ts; then
            echo "catalog unchanged"
          else
            git config user.name "pantaleone-ai"
            git config user.email "mdptrading@gmail.com"
            git add config/social-growth/syn-catalog.ts
            git commit -m "chore(social): nightly catalog sync $(date -u +%F)" || echo "catalog commit skipped (nothing to commit)"
            git push origin HEAD:main || echo "catalog push skipped (will retry next run)"
          fi
      - name: Respin — fresh spin on rested catalog art + recipes (1/site)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry-run || 'false' }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx tsx scripts/social-issues/respin-queue.ts --dry-run --limit 1
          else
            npx tsx scripts/social-issues/respin-queue.ts --apply --limit 1 || echo "respin skipped (no eligible rested content)"
          fi
      - name: Packet — build, visuals, merge (no re-approval, both sites)
        if: github.event_name == 'schedule' || github.event.inputs.dry-run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          for SITE in site:synthetic-pics site:mixphd; do
            for N in $(gh issue list --label social --label "$SITE" --label status:queued --state open --limit 20 --json number --jq '.[].number'); do
              PLAT=$(gh issue view "$N" --json labels --jq '[.labels[].name] | map(select(startswith("platform:"))) | .[0] // empty')
              if [ "$PLAT" != "platform:instagram" ] && [ "$PLAT" != "platform:facebook" ]; then echo "skip #$N ($PLAT)"; continue; fi
              npx tsx scripts/social-issues/auto-packet.ts --issue "$N" --no-reapprove || echo "packet failed #$N (comment on issue, continuing)"
            done
          done
      - name: Schedule — stamp Publish at slots
        if: github.event_name == 'schedule' || github.event.inputs.dry-run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/social-issues/schedule-queue.ts --write
      - name: Facebook — native schedule for slotted posts (both sites)
        if: github.event_name == 'schedule' || github.event.inputs.dry-run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
        run: |
          for SITE in site:synthetic-pics site:mixphd; do
            for N in $(gh issue list --label social --label "$SITE" --label platform:facebook --label status:packet-ready --state open --limit 20 --json number --jq '.[].number'); do
              HAS_PROOF=$(gh issue view "$N" --json comments --jq '[.comments[].body] | any(contains("Platform publish proof"))')
              if [ "$HAS_PROOF" = "true" ]; then echo "skip #$N (proof on file)"; continue; fi
              SLOT=$(gh issue view "$N" --json body --jq '.body' | grep -oE '\*\*Publish at:\*\* `[^`]+`' | grep -oE '`[^`]+`' | tr -d '`' | head -n 1)
              if [ -z "$SLOT" ]; then echo "skip #$N (no slot)"; continue; fi
              npx tsx scripts/social-issues/publish/publish-due.ts --issue "$N" --schedule-at "$SLOT" || echo "schedule failed #$N (kept packet-ready for re-slot)"
            done
          done
      - name: Audit-close — verify due proofs via Graph/API
        if: github.event_name == 'schedule' || github.event.inputs.dry-run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
        run: npx tsx scripts/social-issues/verify-proofs.ts --limit 20 --apply
