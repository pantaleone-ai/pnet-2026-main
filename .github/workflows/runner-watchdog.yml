name: runner-watchdog

# Outcome-based guard for the monitor-lives-on-monitored-box SPOF.
# Instead of polling runner status (requires admin scope no GITHUB_TOKEN
# has), this watches the repo's highest-frequency cron: if its latest run
# is stale or failing, the self-hosted path is broken and this hosted
# workflow fails loudly. Stays on ubuntu-latest BY DESIGN (~96 x 30s/day).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read

env:
  WORKFLOW_FILE: campaign-tick.yml
  STALE_MINUTES: 180

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check fresh green cron run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="$(gh api "repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs?per_page=1&exclude_pull_requests=true" --jq '.workflow_runs[0]')"
          [ "$RUN" != "null" ] || { echo "::error::no runs found for $WORKFLOW_FILE"; exit 1; }
          CONCLUSION="$(echo "$RUN" | jq -r '.conclusion')"
          CREATED="$(echo "$RUN" | jq -r '.created_at')"
          AGE_MIN="$(( ($(date +%s) - $(date -d "$CREATED" +%s)) / 60 )"
          echo "latest run: conclusion=$CONCLUSION created=$CREATED age_min=$AGE_MIN (stale_after=$STALE_MINUTES)"
          if [ "$AGE_MIN" -gt "$STALE_MINUTES" ]; then echo "::error::latest $WORKFLOW_FILE run is stale (${AGE_MIN}m > ${STALE_MINUTES}m)"; exit 1; fi
          if [ "$CONCLUSION" != "success" ]; then echo "::error::latest $WORKFLOW_FILE run concluded: $CONCLUSION"; exit 1; fi
